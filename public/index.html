<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web — départ</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <header>
    <h1>Cuity 👩‍🍳</h1>
  </header>
  <main>
    <section aria-labelledby="titre-chat">
      <h2 id="titre-chat">Discussion</h2>

      <ul id="messages" aria-live="polite">
      </ul>
      <p id="accueil">Bonjour, je suis Cuity 👩‍🍳. Posez-moi vos questions sur la cuisine anti-gaspi !</p>
      <div id="suggestions">
        <button type="button">J'ai faim, propose-moi des recettes anti-gaspi</button>
        <button type="button">J'ai du Penicillium sur mon fromage, puis-je encore le manger ?</button>
        <button type="button">Mes bananes sont noires, quelles recettes puis-je faire ?</button>
      </div>
      <p id="status" role="status"></p>

      <form id="chat-form">
        <label for="message">Votre message</label>
        <textarea id="message" name="message" required maxlength="280" rows="3"></textarea>
        <div id="compteur">
          <span id="longueurAct">0</span>
          <span id="longueurMax">/280</span>
        </div>
        <button type="submit">Envoyer</button>
      </form>
      <button type="button" id="effacer">Effacer la conversation</button>
    </section>
  </main>
  <footer>
    <span id="version">
      Version en attente...
    </span>
  </footer>
  <script type="module" src="./js/view.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>

</html>
